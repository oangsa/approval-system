services:
  test-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workflow_test
      POSTGRES_USER: workflow_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD in apps/api/.env.test}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_test -d workflow_test"]
      interval: 2s
      timeout: 3s
      retries: 15
